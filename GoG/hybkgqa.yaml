name: hybkgqa
# The env that ran the eval locally (2026-11-08): Python 3.11.15 and the exact pip versions in
# vast/requirements-lock.txt (torch 2.6.0+cu124, torch_scatter 2.1.2+pt26cu124, torch-geometric 2.7.0,
# numpy 2.4.4, scipy 1.17.1, pandas 3.0.2, transformers 5.4.0, sentence-transformers 5.3.0).
# conda runs pip from this file's folder, so the relative -r path resolves. Build it with vast/setup.sh.
channels:
  - conda-forge
dependencies:
  - python=3.11.15
  - pip
  - pip:
      - -r ../vast/requirements-lock.txt
