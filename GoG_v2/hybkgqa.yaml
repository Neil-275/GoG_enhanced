name: hybkgqa
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy<2
  - scipy=1.11.4
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - --find-links https://data.pyg.org/whl/torch-2.6.0+cu124.html
      - torch==2.6.0
      - torch-scatter
      - fire
      - tqdm
      - pickle-mixin
      - wandb
      - python-dotenv
      - SPARQLWrapper
      - sentence-transformers
      - openai
      - ipykernel
      - jupyter
      - pydantic
      - pydantic-settings
      - nltk
      - ijson
      - easydict
      - pyyaml
      - torch-geometric
      - pandas
      - loguru
      - datasets
      - tiktoken
