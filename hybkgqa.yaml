name: hybkgqa
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - --find-links https://data.pyg.org/whl/torch-2.6.0+cu124.html
      - torch==2.6.0
      - torchvision==0.21.0
      - torch-scatter
      - fire
      - tqdm
      - numpy
      - pickle-mixin
      - scipy
      - wandb
      - python-dotenv
      - SPARQLWrapper
      - sentence-transformers
      - openai
      - ipykernel
      - jupyter
      - pydantic
      - pydantic-settings
      - nltk
      - ijson
