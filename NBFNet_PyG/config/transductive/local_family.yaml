output_dir: ./experiments/

dataset:
  class: LocalKnowledgeGraph
  root: {{ data_root }}
  train_file: train.txt
  valid_file: valid.txt
  test_file: test.txt
  delimiter: "\t"
  verbose: 1

model:
  class: NBFNet
  input_dim: 32
  hidden_dims: [32, 32, 32, 32, 32, 32]
  message_func: distmult
  aggregate_func: pna
  short_cut: yes
  layer_norm: yes
  dependent: yes
  remove_one_hop: yes

task:
  num_negative: 16
  strict_negative: yes
  adversarial_temperature: 0.5
  metric: [mr, mrr, hits@1, hits@3, hits@10]

optimizer:
  class: Adam
  lr: 5.0e-3

train:
  gpus: {{ gpus }}
  batch_size: 16
  num_epoch: 0
  log_interval: 50

checkpoint: {{ checkpoint }}